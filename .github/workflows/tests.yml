# Chạy test mỗi lần push / mở pull request lên main. Kết quả hiện ở tab Actions và badge trong README.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # cho phép bấm chạy tay trong tab Actions

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"  # đúng phiên bản đã dùng để khóa thư viện trong requirements.txt
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest==9.1.1

      - name: Kiểm tra cú pháp toàn bộ file .py (kể cả app.py, không có test riêng)
        run: python -m compileall -q .

      - name: Chạy pytest
        run: pytest -q
